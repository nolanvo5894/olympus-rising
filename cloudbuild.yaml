steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympus-rising:$SHORT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympus-rising:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympus-rising

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - olympus-rising
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympus-rising:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --quiet

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympus-rising:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/olympus-rising:latest

options:
  logging: CLOUD_LOGGING_ONLY
